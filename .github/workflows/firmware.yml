# Builds the Arduino firmware for the ItsyBitsy M4 and produces a drag-and-drop
# .uf2. Every push uploads it as a workflow artifact; pushing a tag like v1.0.0
# also attaches it to a GitHub Release, which is what the web page links to:
#   https://github.com/interactive-hardware-interfacing/led-iv-lab/releases/latest/download/led_iv_lab.uf2

name: firmware

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['firmware/arduino/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/arduino/**']
  release:
    types: [published]          # release created in the GitHub UI
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the .uf2 to (e.g. v1.0.0). Leave blank to just build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The tag this build belongs to, from whichever event started it.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a manual run for a tag, build that tag's source, not main.
          ref: ${{ env.RELEASE_TAG || github.ref }}

      # Arduino's own install script, pinned to a release. (arduino/setup-arduino-cli
      # still targets Node 20; this avoids the deprecation warning entirely.)
      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh -s 1.5.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      - name: Install the Adafruit SAMD core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:samd

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn adafruit:samd:adafruit_itsybitsy_m4 \
            --output-dir build \
            firmware/arduino/led_iv_lab
          ls -l build

      - name: Convert to UF2
        run: |
          curl -sSL -o uf2conv.py https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py
          curl -sSL -o uf2families.json https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json
          # SAMD51 application starts at 0x4000 (after the UF2 bootloader)
          python3 uf2conv.py -b 0x4000 -f SAMD51 -c -o build/led_iv_lab.uf2 build/led_iv_lab.ino.bin
          ls -l build/led_iv_lab.uf2

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: led_iv_lab-uf2
          path: build/led_iv_lab.uf2

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/led_iv_lab.uf2
          generate_release_notes: true
          # Replace an existing led_iv_lab.uf2 on the release when re-run.
          overwrite_files: true
